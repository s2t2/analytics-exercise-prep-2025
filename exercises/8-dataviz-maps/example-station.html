<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Interactive Maps | Example Train Station</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.0.3/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.0.3/dist/leaflet.js"></script>
  </head>

  <body>
    <h1>Interactive Maps | Example Train Station</h1>
    <a href="../index.html">Home</a>

    <h2>Background</h2>
    <p class="lead">This document provides an example of how to create an interactive map,
      using the <a href="http://leafletjs.com/">Leaflet.js</a> library.
    </p>


    <hr>
    <h2>Map (Example Station)</h2>

    <div id="my-map-container" style="width:75%; height:400px; margin:25px;"></div>

    <script type="text/javascript">

      //
      // INITIALIZE MAP
      //

      var mapContainerId = 'my-map-container'
      var latLonCoords = [41.29771887088102, -72.92673110961914]
      var zoomLevel = 8

      var map = L.map(mapContainerId)
          .setView(latLonCoords, zoomLevel);

      //
      // ADD MAP TILES
      //

      var tileUrlTemplate = 'http://{s}.tile.osm.org/{z}/{x}/{y}.png'
      var tileLayerOptions = {attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors'}

      L.tileLayer(tileUrlTemplate, tileLayerOptions)
          .addTo(map);

      //
      // ADD MARKER(S) TO MAP
      //

      var stationPopup = "<b>New Haven Union Station</b>" + "<br>" + "Some content or context here."

      L.marker([41.29771887088102, -72.92673110961914])
          .addTo(map)
          .bindPopup(stationPopup)




    </script>
  </body>
</html>
